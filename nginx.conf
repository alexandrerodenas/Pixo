server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css application/json application/wasm image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build output never changes: cache it for a year.
  # add_header in a location replaces the server-level headers, so they are included again.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Always revalidate the entry page so a new deploy is picked up.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
}
